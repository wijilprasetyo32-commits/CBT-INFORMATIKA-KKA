            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                localStorage.setItem(DB_KEY, JSON.stringify(initialDB));
                return initialDB;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

            currentUser: null,
            currentView: 'login',
            activeExamId: null,
            darkMode: false,
            sidebarOpen: true

            if (!appState.currentUser) {
                container.innerHTML = renderLoginScreen();
                return;
            }

            if (appState.currentView === 'exam_room') {
                container.innerHTML = renderExamRoomScreen();
                return;
            }

            container.innerHTML = `

                    <!-- Sidebar -->
                    <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 z-30 ${appState.sidebarOpen ? 'translate-x-0' : '-translate-x-64 md:translate-x-0 md:w-20'}">

                            <h2 class="text-2xl font-black tracking-tight">CBT SMART EXAM</h2>

                        </div>
                        <div class="p-8">
                            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Username / NIS</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                            <i class="fa-solid fa-user text-sm"></i>
                                        </span>
                                        <input type="text" id="login-username" required placeholder="Contoh: admin, guru1, siswa1" 
                                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm font-medium">

                                            <i class="fa-solid fa-lock text-sm"></i>
                                        </span>
                                        <input type="password" id="login-password" required placeholder="••••••••" 
                                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm font-medium">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Role / Peran Akses</label>
                                    <select id="login-role" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm font-medium">
                                        <option value="Administrator">Administrator</option>
                                        <option value="Guru">Guru Pengampu</option>
                                        <option value="Pengawas">Pengawas Ujian</option>
                                        <option value="Siswa" selected>Siswa Peserta</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg shadow-brand-500/30 transition flex items-center justify-center gap-2 text-sm">
                                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem Ujian
                                </button>
                            </form>
                            <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700/60 text-center">
                                <p class="text-xs text-slate-500 dark:text-slate-400">Akun demo: <span class="font-mono text-brand-600 font-bold">admin</span>, <span class="font-mono text-brand-600 font-bold">guru1</span>, <span class="font-mono text-brand-600 font-bold">pengawas1</span>, <span class="font-mono text-brand-600 font-bold">siswa1</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const role = document.getElementById('login-role').value;
            const db = getDB();

            let user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.role === role);
            if (!user) {
                user = { id: Date.now(), username, role, name: username.toUpperCase(), email: `${username}@smkn2purwokerto.sch.id`, status: 'Aktif' };
                db.users.push(user);
                saveDB(db);
            }

            appState.currentUser = user;
            appState.currentView = role.toLowerCase() === 'administrator' ? 'admin' :
                                   role.toLowerCase() === 'guru' ? 'guru' :
                                   role.toLowerCase() === 'pengawas' ? 'pengawas' : 'siswa';
            
            showToast(`Selamat datang ${user.name} (${role})`, 'success');
            render();
        }

        function logout() {
            appState.currentUser = null;
            appState.currentView = 'login';
            showToast('Anda telah keluar dari sistem.', 'info');
            render();
        }

        function renderSidebarNavigation() {
            const role = appState.currentUser.role;
            let items = [];

            if (role === 'Administrator') {
                items = [
                    { id: 'admin', label: 'Dashboard Overview', icon: 'fa-chart-pie' },
                    { id: 'students', label: 'Data Siswa', icon: 'fa-user-graduate' },
                    { id: 'teachers', label: 'Data Guru', icon: 'fa-chalkboard-user' },
                    { id: 'classes', label: 'Kelas & Jurusan', icon: 'fa-school' },
                    { id: 'subjects', label: 'Mata Pelajaran', icon: 'fa-book' },
                    { id: 'exams_admin', label: 'Jadwal & Ujian', icon: 'fa-calendar-days' },
                    { id: 'tokens', label: 'Token Ujian', icon: 'fa-key' },
                    { id: 'monitoring_admin', label: 'Monitoring Realtime', icon: 'fa-desktop' },
                    { id: 'results_admin', label: 'Hasil & Rekap Nilai', icon: 'fa-square-poll-vertical' },
                    { id: 'reports', label: 'Laporan & Ekspor', icon: 'fa-file-arrow-down' },
                    { id: 'backup', label: 'Backup & Restore', icon: 'fa-database' }
                ];
            } else if (role === 'Guru') {
                items = [
                    { id: 'guru', label: 'Dashboard Guru', icon: 'fa-house' },
                    { id: 'question_bank', label: 'Bank Soal', icon: 'fa-file-lines' },
                    { id: 'exam_maker', label: 'Buat Paket Ujian', icon: 'fa-file-circle-plus' },
                    { id: 'exam_results_teacher', label: 'Analisis Hasil Nilai', icon: 'fa-chart-column' },
                    { id: 'reports_teacher', label: 'Cetak Laporan', icon: 'fa-print' }
                ];
            } else if (role === 'Pengawas') {
                items = [
                    { id: 'pengawas', label: 'Dashboard Pengawas', icon: 'fa-shield-halved' },
                    { id: 'live_monitor', label: 'Monitoring Peserta', icon: 'fa-eye' },
                    { id: 'violation_logs', label: 'Log Pelanggaran', icon: 'fa-triangle-exclamation' }
                ];
            } else if (role === 'Siswa') {
                items = [
                    { id: 'siswa', label: 'Dashboard Siswa', icon: 'fa-house' },
                    { id: 'active_exams', label: 'Daftar Ujian Aktif', icon: 'fa-laptop-code' },
                    { id: 'exam_history', label: 'Riwayat & Nilai', icon: 'fa-clock-rotate-left' }
                ];
            }

            return items.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${appState.currentView === item.id ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <i class="fa-solid ${item.icon} w-5 shrink-0 text-center"></i>
                    <span class="md:${appState.sidebarOpen ? 'inline' : 'hidden'} truncate">${item.label}</span>
                </button>
            `).join('');
        }

        function switchTab(viewId) {
            appState.currentView = viewId;
            render();
        }

        function renderMainContentByRole() {
            const role = appState.currentUser.role;
            const view = appState.currentView;

            if (role === 'Administrator') {
                if (view === 'admin') return renderAdminDashboard();
                if (view === 'students') return renderStudentsManagement();
                if (view === 'teachers') return renderTeachersManagement();
                if (view === 'classes') return renderClassesManagement();
                if (view === 'subjects') return renderSubjectsManagement();
                if (view === 'exams_admin') return renderExamsAdmin();
                if (view === 'tokens') return renderTokensManagement();
                if (view === 'monitoring_admin') return renderMonitoringAdmin();
                if (view === 'results_admin') return renderResultsAdmin();
                if (view === 'reports') return renderReportsAdmin();
                if (view === 'backup') return renderBackupRestore();
            } else if (role === 'Guru') {
                if (view === 'guru') return renderGuruDashboard();
                if (view === 'question_bank') return renderQuestionBank();
                if (view === 'exam_maker') return renderExamMaker();
                if (view === 'exam_results_teacher') return renderExamResultsTeacher();
                if (view === 'reports_teacher') return renderReportsTeacher();
            } else if (role === 'Pengawas') {
                if (view === 'pengawas' || view === 'live_monitor') return renderPengawasDashboard();
                if (view === 'violation_logs') return renderViolationLogs();
            } else if (role === 'Siswa') {
                if (view === 'siswa' || view === 'active_exams') return renderSiswaDashboard();
                if (view === 'exam_history') return renderSiswaHistory();
            }

            return `<div class="p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700"><h2 class="text-xl font-bold">Modul ${view}</h2><p class="text-slate-500 mt-2">Fitur terintegrasi dengan server SMK Negeri 2 Purwokerto.</p></div>`;
        }

        function saveNewStudent(e) {
            e.preventDefault();
            const nis = document.getElementById('new-nis').value;
            const name = document.getElementById('new-name').value;
            const studentClass = document.getElementById('new-class').value;
            
            const db = getDB();
            db.users.push({ id: Date.now(), username: nis, role: 'Siswa', name, email: `${nis}@siswa.sch.id`, class: studentClass, nis, status: 'Aktif' });
            saveDB(db);
            closeModal();
            showToast('Siswa baru berhasil ditambahkan!', 'success');
            render();

        function deleteStudent(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) return;
            const db = getDB();
            db.users = db.users.filter(u => u.id !== id);
            saveDB(db);
            showToast('Data siswa berhasil dihapus.', 'info');
            render();
        }

            const db = getDB();
            const student = db.users.find(u => u.id === id);
            if (!student) return;

            showModal('Edit Data Siswa', `

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-400 mb-1">NIS Siswa</label>
                        <input type="text" id="edit-nis" value="${student.nis || ''}" required class="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-900 dark:border-slate-700 text-sm">
                    </div>
                    <div>

                        <input type="text" id="edit-name" value="${student.name}" required class="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-900 dark:border-slate-700 text-sm">
                    </div>

                        <select id="edit-class" class="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-900 dark:border-slate-700 text-sm">

            `);
        }

        function saveEditedStudent(e, id) {
            e.preventDefault();
            const nis = document.getElementById('edit-nis').value;
            const name = document.getElementById('edit-name').value;
            const studentClass = document.getElementById('edit-class').value;

            const db = getDB();
            const idx = db.users.findIndex(u => u.id === id);
            if (idx !== -1) {
                db.users[idx].nis = nis;
                db.users[idx].username = nis;
                db.users[idx].name = name;
                db.users[idx].class = studentClass;
                saveDB(db);
                closeModal();
                showToast('Data siswa berhasil diperbarui!', 'success');
                render();
            }
        }

        function generateNewToken() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let token = '';
            for (let i = 0; i < 6; i++) token += chars.charAt(Math.floor(Math.random() * chars.length));
            const db = getDB();
            db.settings.activeToken = token;
            saveDB(db);
            showToast(`Token baru berhasil digenerate: ${token}`, 'success');
            render();
        }

        function saveNewQuestion(e) {
            e.preventDefault();
            const subject = document.getElementById('q-subject').value;
            const question = document.getElementById('q-text').value;
            const A = document.getElementById('q-optA').value;
            const B = document.getElementById('q-optB').value;
            const C = document.getElementById('q-optC').value;
            const D = document.getElementById('q-optD').value;
            const key = document.getElementById('q-key').value.toUpperCase();

            const db = getDB();
            db.questions.push({ id: Date.now(), subject, class: 'XI TE 1', difficulty: 'Sedang', question, options: { A, B, C, D, E: 'Lainnya' }, key, weight: 5, discussion: 'Pembahasan otomatis sistem CBT.' });
            saveDB(db);
            closeModal();
            showToast('Soal baru berhasil ditambahkan ke Bank Soal!', 'success');
            render();
        }

        function deleteQuestion(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus butir soal ini?')) return;
            const db = getDB();
            db.questions = db.questions.filter(q => q.id !== id);
            saveDB(db);
            showToast('Butir soal berhasil dihapus.', 'info');
            render();
        }

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${db.exams.map(e => `
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                                <div>
                                    <span class="px-2.5 py-1 bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300 font-bold text-xs rounded-lg">${e.subject}</span>
                                    <h4 class="text-lg font-bold text-slate-900 dark:text-white mt-2">${e.title}</h4>
                                    <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-clock mr-1"></i> Durasi: ${e.duration} Menit • ${e.totalQuestions} Soal Pilihan Ganda</p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                                    <span class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-circle-check mr-1"></i> Terverifikasi</span>
                                    <button onclick="startExam(${e.id})" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm shadow-md transition">Mulai Kerjakan Ujian</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSiswaHistory() {
            return `
                <div class="space-y-6">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Riwayat Pengerjaan & Hasil Nilai</h2>
                        <p class="text-sm text-slate-500 mt-1">Daftar ujian yang telah diselesaikan.</p>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-slate-900 dark:text-white">Ujian Tengah Semester Gasal - Informatika</h4>
                            <p class="text-xs text-slate-500 mt-1">Selesai • 15 Okt 2026</p>
                        </div>
                        <div class="text-right">
                            <span class="text-3xl font-black text-emerald-600">100</span>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Tuntas KKM</p>
                        </div>
                    </div>
                </div>
            `;
        }

        let currentExamSession = {
            examId: null,
            questions: [],
            currentIndex: 0,
            answers: {},
            flagged: {},
            remainingSeconds: 7200,
            timerInterval: null
        };

        function startExam(examId) {
            const tokenInput = prompt("Masukkan Token Ujian (Token aktif: TEI2026):");
            const db = getDB();
            const exam = db.exams.find(e => e.id === examId);
            
            if (!tokenInput || tokenInput.toUpperCase() !== exam.token.toUpperCase()) {
                showToast('Token ujian tidak valid! Hubungi pengawas ruangan.', 'error');
                return;
            }

            currentExamSession.examId = examId;
            currentExamSession.questions = db.questions;
            currentExamSession.currentIndex = 0;
            currentExamSession.answers = {};
            currentExamSession.flagged = {};
            currentExamSession.remainingSeconds = exam.duration * 60;

            appState.currentView = 'exam_room';
            render();

            if (currentExamSession.timerInterval) clearInterval(currentExamSession.timerInterval);
            currentExamSession.timerInterval = setInterval(() => {
                if (currentExamSession.remainingSeconds > 0) {
                    currentExamSession.remainingSeconds--;
                    const timerEl = document.getElementById('exam-timer');
                    if (timerEl) {
                        const m = Math.floor(currentExamSession.remainingSeconds / 60);
                        const s = currentExamSession.remainingSeconds % 60;
                        timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                } else {
                    clearInterval(currentExamSession.timerInterval);
                    submitExam(true);
                }
            }, 1000);
        }

        function renderExamRoomScreen() {
            const q = currentExamSession.questions[currentExamSession.currentIndex];
            const totalQ = currentExamSession.questions.length;
            const m = Math.floor(currentExamSession.remainingSeconds / 60);
            const s = currentExamSession.remainingSeconds % 60;

            return `
                <div class="flex-1 flex flex-col h-screen bg-slate-900 text-white overflow-hidden">
                    <!-- Exam Header Bar -->
                    <header class="h-16 bg-slate-950 border-b border-slate-800 px-6 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center font-black">SMK</div>
                            <div>
                                <h1 class="text-xs md:text-sm font-bold uppercase tracking-wide">CBT SMART EXAM • SMK NEGERI 2 PURWOKERTO</h1>
                                <p class="text-xs text-slate-400">Peserta: ${appState.currentUser.name} (${appState.currentUser.class || 'XI TE 1'})</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="px-4 py-1.5 bg-brand-900/60 border border-brand-500/50 rounded-xl text-center">
                                <p class="text-[9px] text-brand-300 font-bold uppercase tracking-wider">Sisa Waktu Ujian</p>
                                <p id="exam-timer" class="font-mono font-bold text-accent-400 text-base md:text-lg">${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}</p>
                            </div>
                        </div>
                    </header>

                    <!-- Main Exam Workspace -->
                    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                        <!-- Questions Panel -->
                        <div class="flex-1 p-6 overflow-y-auto custom-scrollbar flex flex-col justify-between">
                            <div class="max-w-3xl mx-auto w-full space-y-6">
                                <div class="flex justify-between items-center bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                                    <span class="font-bold text-brand-400 text-sm">Soal Nomor ${currentExamSession.currentIndex + 1} dari ${totalQ}</span>
                                    <button onclick="toggleFlagCurrent()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${currentExamSession.flagged[currentExamSession.currentIndex] ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                                        <i class="fa-solid fa-flag mr-1"></i> ${currentExamSession.flagged[currentExamSession.currentIndex] ? 'Ditandai Ragu-ragu' : 'Tandai Ragu-ragu'}
                                    </button>
                                </div>

                                <div class="bg-slate-800/90 p-6 rounded-2xl border border-slate-700 shadow-md">
                                    <p class="text-base md:text-lg font-medium leading-relaxed">${q.question}</p>
                                </div>

                                <div class="space-y-3">
                                    ${['A', 'B', 'C', 'D', 'E'].map(optKey => {
                                        const optText = q.options[optKey];
                                        if (!optText) return '';
                                        const isSelected = currentExamSession.answers[currentExamSession.currentIndex] === optKey;
                                        return `
                                            <label onclick="selectAnswer('${optKey}')" class="flex items-center gap-4 p-4 rounded-2xl border cursor-pointer transition ${isSelected ? 'bg-brand-600/30 border-brand-500 text-white' : 'bg-slate-800/60 border-slate-700/80 text-slate-200 hover:bg-slate-800'}">
                                                <span class="w-8 h-8 rounded-xl ${isSelected ? 'bg-brand-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold flex items-center justify-center shrink-0 text-sm">${optKey}</span>
                                                <span class="flex-1 font-medium text-sm md:text-base">${optText}</span>
                                            </label>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- Buttons Bar -->
                            <div class="max-w-3xl mx-auto w-full flex justify-between pt-6 border-t border-slate-800 mt-6">
                                <button onclick="prevQuestion()" ${currentExamSession.currentIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 rounded-xl font-bold text-sm transition">Sebelumnya</button>
                                <button onclick="nextQuestion()" ${currentExamSession.currentIndex === totalQ - 1 ? 'disabled' : ''} class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 disabled:opacity-40 rounded-xl font-bold text-sm transition">Berikutnya</button>
                            </div>
                        </div>

                        <!-- Sidebar Grid Navigator -->
                        <div class="w-full md:w-80 bg-slate-950 p-6 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-xs text-slate-400 uppercase tracking-wider mb-4">Navigasi Nomor Soal</h3>
                                <div class="grid grid-cols-5 gap-2">
                                    ${currentExamSession.questions.map((_, idx) => {
                                        const answered = currentExamSession.answers[idx] !== undefined;
                                        const flagged = currentExamSession.flagged[idx];
                                        const active = currentExamSession.currentIndex === idx;
                                        
                                        let bg = 'bg-slate-800 text-slate-300';
                                        if (flagged) bg = 'bg-amber-500 text-slate-950 font-bold';
                                        else if (answered) bg = 'bg-emerald-600 text-white font-bold';

                                        return `
                                            <button onclick="jumpToQuestion(${idx})" class="h-10 rounded-xl font-mono text-sm font-bold flex items-center justify-center border ${active ? 'border-accent-400 ring-2 ring-accent-400/50' : 'border-transparent'} ${bg}">
                                                ${idx + 1}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                            <div class="mt-6 pt-6 border-t border-slate-800">
                                <button onclick="confirmSubmitExam()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-lg shadow-rose-600/30 transition text-sm">SELESAI UJIAN</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectAnswer(optKey) {
            currentExamSession.answers[currentExamSession.currentIndex] = optKey;
            render();
        }

        function toggleFlagCurrent() {
            currentExamSession.flagged[currentExamSession.currentIndex] = !currentExamSession.flagged[currentExamSession.currentIndex];
            render();
        }

        function nextQuestion() {
            if (currentExamSession.currentIndex < currentExamSession.questions.length - 1) {
                currentExamSession.currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentExamSession.currentIndex > 0) {
                currentExamSession.currentIndex--;
                render();
            }
        }

        function jumpToQuestion(idx) {
            currentExamSession.currentIndex = idx;
            render();
        }

        function confirmSubmitExam() {
            if (confirm("Apakah Anda yakin ingin mengirim seluruh jawaban dan menyelesaikan ujian?")) {
                submitExam(false);
            }
        }

        function submitExam(isAuto = false) {
            if (currentExamSession.timerInterval) clearInterval(currentExamSession.timerInterval);
            appState.currentView = 'siswa';
            showToast(isAuto ? 'Waktu pengerjaan habis! Jawaban Anda otomatis tersimpan.' : 'Jawaban ujian berhasil dikirimkan ke server.', 'success');
            render();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            toast.className = `px-5 py-3 rounded-xl shadow-xl font-semibold text-xs md:text-sm flex items-center gap-3 transition-all ${bg}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'}"></i> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3500);
        }

        function showModal(title, htmlContent) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-200 dark:border-slate-700">
                        <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center">
                            <h3 class="font-bold text-base">${title}</h3>
                            <button onclick="closeModal()" class="text-white hover:text-brand-200"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="p-6">${htmlContent}</div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function toggleDarkMode() {
            appState.darkMode = !appState.darkMode;
            render();
        }

        function toggleSidebar() {
            appState.sidebarOpen = !appState.sidebarOpen;
            render();
        }

        function bindDashboardEvents() {
            if (appState.currentView === 'admin') {
                const ctx = document.getElementById('adminChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['XI TE 1', 'XI TE 2', 'XII TKJ 1', 'X TE 1'],
                            datasets: [{
                                label: 'Rata-rata Nilai CBT',
                                data: [88, 85, 92, 84],
                                backgroundColor: '#2563eb',
                                borderRadius: 8
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } }
                        }
                    });
                }
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
